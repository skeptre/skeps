name: Phase 1 dependency refresh

on:
  push:
    branches:
      - phase-1/cloudflare-repo-health

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1/cloudflare-repo-health

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh platform dependencies
        run: |
          npm uninstall @vercel/analytics
          npm install --save-exact next@16.3.5
          npm install --save-dev --save-exact eslint-config-next@16.3.5 @opennextjs/cloudflare@1.20.6 wrangler@4.135.0

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Cloudflare and Next.js dependencies"
          git push origin HEAD:phase-1/cloudflare-repo-health
